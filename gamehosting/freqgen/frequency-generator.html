<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frequency generator</title>
<meta name="description" content="A single-file tone generator: pick a frequency and a waveform.">
<meta name="theme-color" content="#08080b">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#08080b; --panel:#0d0d11; --panel-2:#141419;
    --ink:#f2f3f5; --dim:#9a9aa5; --dimmer:#71717d;
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.2);
    --accent:#d7ff3e; --accent-rgb:215,255,62; --accent-ink:#0a0c02;
    --font:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%; max-width:100%; overflow-x:hidden}
body{
    margin:0;
    padding:22px 18px calc(28px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--ink);
    font:400 15px/1.5 var(--font);
    display:flex; flex-direction:column; align-items:center;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
}
::selection{background:rgba(var(--accent-rgb),.4)}
a{color:inherit}
.wrap{width:100%; max-width:520px}

header{display:flex; align-items:center; gap:11px; margin-bottom:18px}
.back{
    width:40px; height:40px; flex:none; border-radius:10px; display:grid; place-items:center;
    border:1px solid var(--line); color:var(--dim); text-decoration:none;
}
.back:hover{color:var(--ink); border-color:var(--line-2)}
.back svg{width:17px; height:17px}
.brand{min-width:0; font:600 15px/1.25 var(--font); letter-spacing:-.02em}
.brand span{display:block; font:400 12px/1.4 var(--font); color:var(--dimmer)}

.card{
    padding:18px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line);
}

.readout{
    display:flex; align-items:baseline; gap:7px;
    font:600 clamp(36px, 12vw, 54px)/1 var(--mono);
    letter-spacing:-.03em; color:var(--ink);
    white-space:nowrap;
}
.readout small{font-size:14px; font-weight:500; color:var(--dim); letter-spacing:0}
.note{margin:8px 0 16px; font:400 12.5px/1.45 var(--font); color:var(--dimmer)}

input[type=range]{
    -webkit-appearance:none; appearance:none;
    display:block; width:100%; height:34px; margin:0;
    background:transparent; cursor:pointer; touch-action:pan-y;
}
input[type=range]::-webkit-slider-runnable-track{
    height:5px; border-radius:99px; background:rgba(255,255,255,.14);
}
input[type=range]::-moz-range-track{height:5px; border-radius:99px; background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:22px; height:22px; margin-top:-8.5px;
    border-radius:50%; background:var(--accent); border:none;
}
input[type=range]::-moz-range-thumb{width:22px; height:22px; border:none; border-radius:50%; background:var(--accent)}

.block{margin-top:14px}
.label{margin:0 0 8px; font:400 12px/1 var(--font); color:var(--dimmer)}
.freq-input{
    width:100%; height:44px; padding:0 13px; border-radius:10px;
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--ink); font:500 16px/1 var(--mono); outline:none;
    -moz-appearance:textfield;
}
.freq-input:focus{border-color:rgba(var(--accent-rgb),.55)}
.freq-input::-webkit-outer-spin-button,
.freq-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

.waves{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:7px}
.waves button{
    height:42px; min-width:0; border-radius:9px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--dim); font:500 13px/1 var(--font);
    transition:background .14s, border-color .14s, color .14s;
}
.waves button:hover{color:var(--ink); border-color:var(--line-2)}
.waves button.on{background:rgba(var(--accent-rgb),.14); border-color:rgba(var(--accent-rgb),.55); color:var(--ink)}

.chips{
    display:flex; gap:7px; margin-top:16px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:2px; scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chips button{
    flex:none; height:34px; padding:0 13px; border-radius:99px; cursor:pointer;
    background:transparent; border:1px solid var(--line);
    color:var(--dim); font:500 12.5px/1 var(--mono);
}
.chips button:hover{color:var(--ink); border-color:var(--line-2)}

.play{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; height:52px; margin-top:16px; border-radius:11px; cursor:pointer;
    background:var(--accent); border:1px solid var(--accent);
    color:var(--accent-ink); font:600 15px/1 var(--font);
    -webkit-tap-highlight-color:transparent;
}
.play:active{transform:scale(.995)}
.play.playing{background:transparent; border-color:var(--line-2); color:var(--ink)}
.play svg{width:15px; height:15px}

.foot{margin-top:18px; font:400 12.5px/1.7 var(--font); color:var(--dimmer); text-align:center}
.foot a{color:var(--dim); text-decoration:underline; text-underline-offset:3px}
.foot a:hover{color:var(--ink)}

/* two columns only when there is room for them */
@media (min-width:440px){
    .split{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:end}
    .split .block{margin-top:14px}
}
@media (max-width:439px){
    .split .block:first-child{margin-top:14px}
}
@media (max-width:380px){
    body{padding:16px 12px calc(24px + env(safe-area-inset-bottom))}
    .wrap{max-width:100%}
    header{margin-bottom:14px}
    .brand{font-size:14px}
    .brand span{display:none}
    .card{padding:14px; border-radius:12px}
    .readout{font-size:clamp(32px, 13vw, 44px)}
    .waves{grid-template-columns:repeat(2, minmax(0,1fr))}
    .play{height:50px; font-size:14.5px}
    .chips button{height:36px; padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
    .play{transition:none}
    .play:active{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
    <header>
        <a class="back" href="../index.html" title="Back to watermusic" aria-label="Back to watermusic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        </a>
        <div class="brand">Frequency generator <span>one oscillator, no installs</span></div>
    </header>

    <div class="card">
        <div class="readout"><span id="readout">440</span><small>Hz</small></div>
        <p class="note" id="note">A4 · concert pitch</p>

        <input type="range" id="slider" min="0" max="1000" value="612" step="1" aria-label="Frequency">

        <div class="split">
            <div class="block">
                <p class="label">Exact frequency (Hz)</p>
                <input class="freq-input" id="number" type="number" inputmode="decimal" min="20" max="20000" step="1" value="440" aria-label="Frequency in hertz">
            </div>
            <div class="block">
                <p class="label">Waveform</p>
                <div class="waves" id="waves">
                    <button type="button" data-wave="sine" class="on">Sine</button>
                    <button type="button" data-wave="square">Square</button>
                    <button type="button" data-wave="triangle">Tri</button>
                    <button type="button" data-wave="sawtooth">Saw</button>
                </div>
            </div>
        </div>

        <div class="chips" id="chips">
            <button type="button" data-freq="40">40</button>
            <button type="button" data-freq="100">100</button>
            <button type="button" data-freq="440">440</button>
            <button type="button" data-freq="528">528</button>
            <button type="button" data-freq="1000">1k</button>
            <button type="button" data-freq="4000">4k</button>
            <button type="button" data-freq="10000">10k</button>
        </div>

        <button class="play" id="play" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <span id="playLabel">Play tone</span>
        </button>
    </div>

    <p class="foot">
        Full volume, always — use your device's volume buttons.<br>
        Space plays and stops · single file, save it and open it anywhere.<br>
        <a href="../index.html">Back to the games</a>
    </p>
</div>

<script>
(function () {
    'use strict';
    var MIN = 20, MAX = 20000;
    var KEY = 'wm.freq.v1';
    // fixed at 100%: no volume control by design
    var VOLUME = 1;
    var readout = document.getElementById('readout');
    var note = document.getElementById('note');
    var slider = document.getElementById('slider');
    var number = document.getElementById('number');
    var playBtn = document.getElementById('play');
    var playLabel = document.getElementById('playLabel');

    var state = { freq: 440, wave: 'sine' };
    try {
        var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && isFinite(saved.freq)) {
            state.freq = clamp(saved.freq, MIN, MAX);
            if (typeof saved.wave === 'string') state.wave = saved.wave;
        }
    } catch (e) { }

    var ctx = null, osc = null, gain = null, playing = false;

    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, Number(v) || lo)); }
    // the slider is logarithmic so the low end is not squeezed into a few pixels
    function toSlider(freq) { return 1000 * Math.log(freq / MIN) / Math.log(MAX / MIN); }
    function fromSlider(pos) { return MIN * Math.pow(MAX / MIN, pos / 1000); }

    var NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    function noteName(freq) {
        if (freq < 20 || freq > 20000) return '';
        var midi = Math.round(69 + 12 * Math.log(freq / 440) / Math.LN2);
        var cents = Math.round(1200 * Math.log(freq / (440 * Math.pow(2, (midi - 69) / 12))) / Math.LN2);
        var name = NOTES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
        if (Math.abs(cents) < 4) return name + ' · spot on';
        return name + ' ' + (cents > 0 ? '+' : '') + cents + ' cents';
    }

    function paint() {
        readout.textContent = state.freq >= 1000
            ? (state.freq / 1000).toFixed(2).replace(/\.?0+$/, '') + 'k'
            : String(Math.round(state.freq));
        number.value = Math.round(state.freq);
        slider.value = toSlider(state.freq);
        note.textContent = noteName(state.freq) || 'very low — more felt than heard';
        document.querySelectorAll('#waves button').forEach(function (b) {
            b.classList.toggle('on', b.getAttribute('data-wave') === state.wave);
        });
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { }
    }

    function audio() {
        if (!ctx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ctx = new AC();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function start() {
        var c = audio();
        if (!c) { note.textContent = 'this browser has no audio engine'; return; }
        osc = c.createOscillator();
        gain = c.createGain();
        osc.type = state.wave;
        osc.frequency.value = state.freq;
        // ramp instead of jumping, so starting and stopping never clicks
        gain.gain.setValueAtTime(0.0001, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(VOLUME, c.currentTime + 0.04);
        osc.connect(gain).connect(c.destination);
        osc.start();
        playing = true;
        playBtn.classList.add('playing');
        playBtn.setAttribute('aria-pressed', 'true');
        playLabel.textContent = 'Stop';
    }

    function stop() {
        if (!osc || !ctx) return;
        var o = osc, g = gain, c = ctx;
        osc = null; gain = null;
        try {
            g.gain.cancelScheduledValues(c.currentTime);
            g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.05);
            o.stop(c.currentTime + 0.07);
        } catch (e) { }
        playing = false;
        playBtn.classList.remove('playing');
        playBtn.setAttribute('aria-pressed', 'false');
        playLabel.textContent = 'Play tone';
    }

    function setFreq(value) {
        state.freq = clamp(Math.round(value), MIN, MAX);
        if (osc && ctx) osc.frequency.setTargetAtTime(state.freq, ctx.currentTime, 0.01);
        paint();
    }

    slider.addEventListener('input', function () { setFreq(fromSlider(Number(slider.value))); });
    number.addEventListener('change', function () { setFreq(number.value); paint(); });
    number.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { setFreq(number.value); e.preventDefault(); number.blur(); }
    });

    document.getElementById('waves').addEventListener('click', function (e) {
        var b = e.target.closest('[data-wave]');
        if (!b) return;
        state.wave = b.getAttribute('data-wave');
        if (osc) osc.type = state.wave;
        paint();
    });

    document.getElementById('chips').addEventListener('click', function (e) {
        var b = e.target.closest('[data-freq]');
        if (!b) return;
        setFreq(Number(b.getAttribute('data-freq')));
    });

    playBtn.addEventListener('click', function () { playing ? stop() : start(); });

    document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space' && e.key !== ' ') return;
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.isContentEditable)) return;
        e.preventDefault();
        playing ? stop() : start();
    });

    window.addEventListener('pagehide', stop);
    paint();
})();
</script>
</body>
</html>
