<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting game…</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body { height: 100%; }
        body {
            margin: 0; display: grid; place-items: center; text-align: center;
            background: #08080b; color: #f2f3f5; padding: 24px;
            font: 400 14px/1.6 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .spin {
            width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.14); border-top-color: #d7ff3e;
            animation: turn .7s linear infinite;
        }
        @keyframes turn { to { transform: rotate(360deg); } }
        p { margin: 0 0 10px; color: #9a9aa5; }
        .err { display: none; max-width: 44ch; color: #ff9a9a; }
        a { color: #d7ff3e; text-decoration: none; border-bottom: 1px solid rgba(215,255,62,.4); }
    </style>
</head>
<body>
    <div>
        <div class="spin" id="spin"></div>
        <p id="msg">Starting the game…</p>
        <p class="err" id="err"></p>
        <p><a href="./index.html" id="back">Back to watermusic</a></p>
    </div>
<script>
/* Old bookmarks and links point at play.html?id=NN. The games are real files on
   this server now (gamehosting/gnmath/), so this page just looks the file up in
   the manifest and sends the tab straight there. */
(function () {
    'use strict';
    var msg = document.getElementById('msg');
    var spin = document.getElementById('spin');
    var err = document.getElementById('err');
    var id = new URLSearchParams(location.search).get('id') || '';

    function fail(text) {
        spin.style.display = 'none';
        msg.style.display = 'none';
        err.textContent = text;
        err.style.display = 'block';
    }

    if (!/^\d+$/.test(id)) { fail('That link is missing its game id.'); return; }

    msg.textContent = 'Finding the game…';
    fetch('./data/zones.json', { cache: 'default' })
        .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function (list) {
            var zone = (Array.isArray(list) ? list : []).filter(function (z) { return String(z.id) === id; })[0];
            var url = zone ? String(zone.url || '').replace('{HTML_URL}', './gamehosting/gnmath').replace('{COVER_URL}', '') : '';
            if (!url || url.indexOf('gamehosting/') === -1) throw new Error('that game is no longer in the list');
            msg.textContent = 'Starting the game…';
            location.replace(url);
        })
        .catch(function (e) {
            fail('That game could not be opened (' + (e && e.message ? e.message : 'network error') + ').');
        });
})();
</script>
</body>
</html>
