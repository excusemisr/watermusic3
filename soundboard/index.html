<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="style.css?v=2" rel="stylesheet">
    <script src="sounds.js" defer></script>
    <script src="main.js?v=2" defer></script>
</head>

<body>
    <header class="sb-bar">
        <label class="sb-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Search sounds…" autocomplete="off" spellcheck="false" aria-label="Search sounds">
            <kbd class="sb-kbd">/</kbd>
        </label>
        <div class="sb-actions">
            <div class="sb-chips" id="modeChips" role="group" aria-label="Filter sounds">
                <button class="chip active" type="button" data-mode="all">All</button>
                <button class="chip" type="button" data-mode="fav">Favorites</button>
                <button class="chip" type="button" data-mode="recent">Recent</button>
            </div>
            <button id="toggleButton" class="sb-btn" type="button" aria-pressed="false">Overlap: off</button>
            <button id="stopButton" class="sb-btn" type="button">Stop all</button>
            <button id="ttsToggle" class="sb-btn" type="button" aria-expanded="false">Text to speech</button>
        </div>
    </header>

    <p class="sb-hint">
        <span>Click a tile to play it.</span>
        <span>Right-click or long-press for favorite and download.</span>
    </p>

    <main id="soundboard" class="sb-grid" aria-label="Sounds"></main>

    <div class="sb-empty" id="sbEmpty" hidden>
        <b>Nothing matches that</b>
        <span>Try a shorter search, or switch back to All.</span>
    </div>

    <div class="sb-sentinel" id="sbSentinel" aria-hidden="true"></div>
    <p class="sb-count" id="sbCount"></p>

    <div id="ttsPanel" class="tts-panel hidden">
        <div class="tts-panel-header">
            <span class="tts-title">Text to speech</span>
            <button id="ttsClose" class="tts-close" type="button" aria-label="Close text to speech">✕</button>
        </div>
        <textarea id="ttsText" class="tts-textarea" placeholder="Type something to speak…"></textarea>
        <div class="tts-controls-grid">
            <div class="tts-control-group full-width">
                <label class="tts-label" for="ttsVoice">Voice</label>
                <select id="ttsVoice" class="tts-select"></select>
            </div>
            <div class="tts-control-group">
                <label class="tts-label" for="ttsVolume">Volume <span id="ttsVolumeVal" class="tts-val">1.00</span></label>
                <input type="range" id="ttsVolume" class="tts-slider" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label" for="ttsRate">Rate <span id="ttsRateVal" class="tts-val">1.0</span></label>
                <input type="range" id="ttsRate" class="tts-slider" min="0.1" max="10" step="0.1" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label" for="ttsPitch">Pitch <span id="ttsPitchVal" class="tts-val">1.00</span></label>
                <input type="range" id="ttsPitch" class="tts-slider" min="0" max="2" step="0.05" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label" for="ttsLangFilter">Language</label>
                <select id="ttsLangFilter" class="tts-select"></select>
            </div>
        </div>

        <div id="ttsStatus" class="tts-status">Ready</div>

        <div class="tts-actions">
            <button id="ttsSpeak" class="tts-btn tts-btn-speak" type="button">Speak</button>
            <button id="ttsPause" class="tts-btn tts-btn-pause" type="button" disabled>Pause</button>
            <button id="ttsResume" class="tts-btn tts-btn-resume" type="button" disabled>Resume</button>
            <button id="ttsStop" class="tts-btn tts-btn-stop" type="button" disabled>Stop</button>
            <button id="ttsReset" class="tts-btn tts-btn-reset" type="button">Reset</button>
        </div>

        <div id="ttsSpeaking" class="tts-speaking-display hidden">
            <span class="tts-speaking-label">Now speaking</span>
            <span id="ttsCurrentWord" class="tts-current-word"></span>
        </div>
    </div>
</body>

</html>
